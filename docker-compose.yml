version: '3.9'

services:
  # ---- API Backend ----
  api:
    build: .
    container_name: handle-growth-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      ENABLE_SCHEDULER: "true"
    ports:
      - "127.0.0.1:3001:3001"   # Solo accesible desde localhost (nginx hace proxy)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - handle-net

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: handle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-handle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-handle_growth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "127.0.0.1:5432:5432"   # Solo accesible desde localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handle}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - handle-net

  # ---- Nginx reverse proxy ----
  nginx:
    image: nginx:alpine
    container_name: handle-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - handle-net

  # ---- Certbot (SSL automático) ----
  certbot:
    image: certbot/certbot
    container_name: handle-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_www:
  certbot_conf:

networks:
  handle-net:
    driver: bridge
